<!DOCTYPE html>
<html lang="fr" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>چرخ‌گوشت اسپیکینگ TCF — ۱۰ موضوع</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; height:100%; background: radial-gradient(ellipse at 50% 0%, #1a1410 0%, #0a0806 55%, #050403 100%);
    color:#f4ede4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, "Vazirmatn", sans-serif;
    overflow:hidden; overscroll-behavior:none; touch-action:none;
  }
  #top {
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding: 14px 16px 10px; text-align:center;
    background: linear-gradient(to bottom, rgba(5,4,3,0.92) 60%, transparent);
  }
  #top h1, #top p { pointer-events:none; }
  #top h1 {
    margin:0; font-size:16px; font-weight:800; letter-spacing:0.2px;
    color:#f4ede4;
  }
  #top p {
    margin:4px 0 0; font-size:11.5px; color:rgba(244,237,228,0.55);
  }
  #settingsBtn {
    position:absolute; top:12px; left:14px;
    background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
    border-radius:50%; width:34px; height:34px; font-size:16px;
    color:#f4ede4; cursor:pointer; pointer-events:auto;
  }
  #settingsPanel {
    position:fixed; top:0; right:0; bottom:0; z-index:40;
    width:min(300px, 82vw);
    background: #100d0a; border-left:1px solid rgba(255,255,255,0.12);
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateX(100%);
    transition: transform 0.25s ease;
    overflow-y:auto;
  }
  #settingsPanel.open { transform: translateX(0); }
  #settingsHeader {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; font-size:14px; font-weight:800; color:#f4ede4;
  }
  #settingsCloseBtn {
    background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
    border-radius:8px; color:#f4ede4; width:30px; height:30px; cursor:pointer; font-size:14px;
  }
  #settingsPanel .settings-row {
    display:flex; flex-direction:column; gap:8px;
    font-size:12.5px; color:rgba(244,237,228,0.75); font-weight:700;
  }
  .zoom-row { display:flex; align-items:center; gap:10px; }
  .speed-input-row { display:flex; align-items:center; gap:8px; }
  .speed-input-row input[type=number] {
    width:80px; padding:9px 10px; border-radius:8px;
    background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16);
    color:#f4ede4; font-size:14px; direction:ltr; text-align:center;
  }
  .zoom-row input[type=range] { flex:1; }
  #zoomLabel { font-size:12px; color:#f4ede4; width:38px; text-align:left; direction:ltr; }
  .settings-hint {
    margin:2px 0 0; font-size:11px; font-weight:400; line-height:1.6;
    color:rgba(244,237,228,0.5);
  }
  .mode-row { display:flex; gap:8px; }
  .mode-btn {
    flex:1; padding:9px 4px; border-radius:10px; text-align:center;
    background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
    color:rgba(244,237,228,0.7); font-size:12px; font-weight:700; cursor:pointer;
  }
  .mode-btn.active { background:#f4ede4; border-color:#f4ede4; color:#100d0a; }
  #settingsPanel input[type=password] {
    width:100%; padding:9px 10px; border-radius:8px;
    background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16);
    color:#f4ede4; font-size:13px; direction:ltr; text-align:left;
  }
  #generateBtn { justify-content:center; }
  #generateBtn:disabled { opacity:0.5; cursor:default; }
  #settingsOverlay {
    position:fixed; inset:0; z-index:35; background:rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  #settingsOverlay.open { opacity:1; pointer-events:auto; }
  #scene {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective: 1400px;
    cursor: grab;
  }
  #scene.grabbing { cursor: grabbing; }
  #zoomLayer {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    transform: scale(var(--zoom, 0.7));
    transform-origin: 50% 50%;
    transition: transform 0.12s ease;
    transform-style: preserve-3d;
  }
  #skewer {
    position:absolute; top:6%; bottom:6%; left:50%; width:6px; margin-left:-3px;
    background: linear-gradient(to bottom, #8a8f98, #4a4e57 8%, #4a4e57 92%, #8a8f98);
    border-radius:3px; z-index:1;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
  }
  #skewer::before, #skewer::after {
    content:''; position:absolute; left:50%; transform:translateX(-50%);
    width:22px; height:22px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #cfd3d8, #6d7178 70%);
  }
  #skewer::before { top:-14px; }
  #skewer::after { bottom:-14px; }
  #cylinder-wrap {
    position:relative; width:1px; height:1px; z-index:5;
    transform-style: preserve-3d;
  }
  #cylinder {
    position:absolute; top:0; left:0;
    transform-style: preserve-3d;
    width:1px; height:1px;
    animation: spin 34s linear infinite;
  }
  #cylinder.paused { animation-play-state: paused; }
  @keyframes spin {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
  }
  @keyframes spinReverse {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(-360deg); }
  }
  .face {
    position:absolute; top:50%; left:50%;
    width:260px; height:620px;
    margin:-310px 0 0 -130px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.05), transparent 18%),
      linear-gradient(90deg, rgba(0,0,0,0.35), rgba(0,0,0,0.05) 12%, rgba(0,0,0,0.05) 88%, rgba(0,0,0,0.35)),
      #14100c;
    border-inline: 1px solid rgba(255,255,255,0.06);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.55);
    border-radius: 10px;
    overflow:hidden;
    backface-visibility: hidden;
  }
  .face::before {
    content:''; position:absolute; top:0; left:0; right:0; height:5px;
    background: var(--face-color); opacity:0.9;
  }
  .face-inner {
    position:absolute; inset:0; padding: 18px 14px 14px;
    display:flex; flex-direction:column; height:100%;
  }
  .face-head {
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
    flex-shrink:0; flex-wrap:wrap;
  }
  .face-icon { font-size:22px; filter: drop-shadow(0 0 6px rgba(0,0,0,0.6)); }
  .face-name {
    font-size:13px; font-weight:800; color: var(--face-color);
    line-height:1.25;
  }
  .face-badge {
    margin-inline-start:auto;
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px;
    background: rgba(255,255,255,0.08); border:1px solid var(--face-color);
    color: var(--face-color); white-space:nowrap;
  }
  .face-list {
    margin:0; padding-inline-start:18px; list-style: decimal;
    display:flex; flex-direction:column; gap:8px;
    overflow-y:auto; flex:1;
    direction:ltr; text-align:left;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .face-list::-webkit-scrollbar { width:4px; }
  .face-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius:2px; }
  .face-list li {
    font-size:12.5px; line-height:1.4; color: var(--face-color);
    font-style:italic;
    opacity:0.95;
  }
  #controls {
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(5,4,3,0.95) 55%, transparent);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #btnrow { display:flex; align-items:center; gap:10px; }
  .ctl-btn {
    background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
    color:#f4ede4; border-radius:999px; padding:9px 16px; font-size:13px;
    font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .ctl-btn:active { background: rgba(255,255,255,0.16); }
  .ctl-btn.active-dir { background:#f4ede4; border-color:#f4ede4; color:#100d0a; }
  #btnrow .ctl-btn { font-size:18px; padding:10px 18px; line-height:1; }
  #hint {
    position:fixed; top:64px; left:50%; transform:translateX(-50%);
    font-size:11px; color:rgba(244,237,228,0.45); z-index:20;
    pointer-events:none; text-align:center;
  }
</style>
</head>
<body>

  <div id="top">
    <button id="settingsBtn" title="تنظیمات">⚙️</button>
  </div>

  <div id="settingsOverlay"></div>
  <div id="settingsPanel">
    <div id="settingsHeader">
      <span>تنظیمات</span>
      <button id="settingsCloseBtn">✕</button>
    </div>
    <div class="settings-row">
      <span>بزرگ‌نمایی (زوم)</span>
      <div class="zoom-row">
        <input type="range" id="zoomRange" min="45" max="130" step="5" value="70">
        <span id="zoomLabel">70%</span>
      </div>
      <p class="settings-hint">اگه جمله‌ها ناقص یا ریز دیده می‌شن، زوم رو کمتر کن تا کل استوانه عقب‌تر بره و همه چیز خونا بشه.</p>
    </div>
    <div class="settings-row" style="border-top:1px solid rgba(255,255,255,0.12); padding-top:14px; margin-top:14px;">
      <span>سرعت چرخش (ثانیه برای هر دور کامل)</span>
      <div class="speed-input-row">
        <input type="number" id="speedInput" min="1" step="1" value="34" inputmode="numeric">
        <button class="ctl-btn" id="speedApplyBtn">اعمال</button>
      </div>
      <p class="settings-hint">هر ضلع استوانه یکی‌درمیون سؤال تسک ۲ و جمله تسک ۳ نشون می‌ده؛ بعد از هر چرخش کامل، جای این دوتا رو با هم عوض می‌کنه.</p>
    </div>
    <div class="settings-row" style="border-top:1px solid rgba(255,255,255,0.12); padding-top:14px; margin-top:14px;">
      <span>کلید API جمینای</span>
      <input type="password" id="apiKeyInput" placeholder="کلید API را اینجا وارد کن">
      <button class="ctl-btn" id="generateBtn" style="width:100%; justify-content:center;">🪄 تولید محتوای جدید با هوش مصنوعی</button>
      <div id="genStatus" class="settings-hint"></div>
    </div>
  </div>

  <div id="scene">
    <div id="zoomLayer">
      <div id="skewer"></div>
      <div id="cylinder-wrap">
        <div id="cylinder">

      </div>
    </div>
    </div>
  </div>

  <div id="controls">
    <div id="btnrow">
      <button class="ctl-btn" id="spinLtrBtn" title="Spin Left → Right">⟳</button>
      <button class="ctl-btn" id="spinRtlBtn" title="Spin Right → Left">⟲</button>
      <button class="ctl-btn" id="updateBtn" title="Update">🔄</button>
    </div>
  </div>

    goToFace(currentFaceIndex);
  }
  scene.addEventListener('mousedown', e => {
    if (e.target.closest('.face-list')) return;
    dragStart(e.clientX);
  });
  window.addEventListener('mousemove', e => dragMove(e.clientX));
  window.addEventListener('mouseup', dragEnd);
  scene.addEventListener('touchstart', e => {
    if (e.target.closest('.face-list')) return;
    dragStart(e.touches[0].clientX);
  }, {passive:true});
  window.addEventListener('touchmove', e => dragMove(e.touches[0].clientX), {passive:true});
  window.addEventListener('touchend', dragEnd);

  // tap on scene background (not drag) toggles play/pause
  let downTime = 0, downX = 0, downOnList = false;
  scene.addEventListener('pointerdown', e => {
    downTime = Date.now();
    downX = e.clientX;
    downOnList = !!e.target.closest('.face-list');
  });
  scene.addEventListener('pointerup', e => {
    if (downOnList) return;
    const dt = Date.now() - downTime;
    const dx = Math.abs(e.clientX - downX);
    if (dt < 250 && dx < 6) {
      if (isSpinning) pauseSpin(); else resumeSpin();
    }
  });
})();
</script>
</body>
</html>
